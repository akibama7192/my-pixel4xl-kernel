name: Build Pixel 4 XL KSU-Next + SUSFS Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space Manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev xz-utils libelf-dev

      - name: Download Proton Clang Compiler
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          RAW_URL="https://github.com/kdrag0n/proton-clang"
          CLEAN_URL=$(echo "$RAW_URL" | tr -d ' ')
          git clone --depth=1 "$CLEAN_URL" clang

      - name: Clone Kirisakura Kernel Source
        run: |
          RAW_URL="https://github.com/freak07/FLORAL"
          CLEAN_URL=$(echo "$RAW_URL" | tr -d ' ')
          git clone --depth=1 "$CLEAN_URL" $GITHUB_WORKSPACE/kernel

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # 1. Скачивание и интеграция KernelSU-Next (ветка legacy)
          RAW_URL_KSU="https://github.com/rifsxd/KernelSU-Next"
          CLEAN_URL_KSU=$(echo "$RAW_URL_KSU" | tr -d ' ')
          git clone --depth=1 -b legacy "$CLEAN_URL_KSU" KernelSU-Next
          
          # Запуск установщика (он создает симлинк на папку KernelSU-Next)
          bash KernelSU-Next/kernel/setup.sh legacy
          
          # Фикс пространства имен применяется по реальному пути, куда указывает симлинк
          sed -i "s/\&init_user_ns/current_user_ns()/g" KernelSU-Next/kernel/drivers/ksu.c || true
          
          # 2. Скачивание и точная интеграция патчей SUSFS для ветки kernel-4.14
          RAW_URL_SUSFS="https://gitlab.com/simonpunk/susfs4ksu.git"
          CLEAN_URL_SUSFS=$(echo "$RAW_URL_SUSFS" | tr -d ' ')
          git clone --depth=1 "$CLEAN_URL_SUSFS" -b kernel-4.14 susfs_src
          
          # Копирование исходных файлов SUSFS из директории kernel_patches (для ядра 4.14)
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/kernel/ || true
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          
          # Применение патча SUSFS для KernelSU-Next
          cd KernelSU-Next/kernel
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
          # Возвращаемся в корень ядра и применяем патч системных вызовов vfs ядра 4.14
          cd $GITHUB_WORKSPACE/kernel
          patch -p1 < susfs_src/kernel_patches/4.14/50_add_susfs_in_kernel-4.14.patch || true
          rm -rf susfs_src

          # 3. Настройка Wireguard (если присутствует в репозитории)
          if [ -f "net/wireguard.tar.xz" ]; then
            mkdir -p net/wireguard
            tar -xf net/wireguard.tar.xz -C net/wireguard --strip-components=1 || true
            touch net/wireguard/Kconfig || true
          fi
          
          # Фикс несовместимых флагов компиляции Proton Clang
          find . -name "Makefile*" -exec sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' {} + || true
          sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' Makefile || true
          
          # 4. Редактирование конфигурации floral_defconfig
          DEFCONFIG="arch/arm64/configs/floral_defconfig"
          
          sed -i 's/CONFIG_IKCONFIG=n/CONFIG_IKCONFIG=y/g' $DEFCONFIG || true
          sed -i 's/CONFIG_IKCONFIG_PROC=y/CONFIG_IKCONFIG_PROC=n/g' $DEFCONFIG || true
          
          sed -i 's/CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y/CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=n/g' $DEFCONFIG || true
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/g' $DEFCONFIG || true
          sed -i 's/CONFIG_MSM_DFC=y/CONFIG_MSM_DFC=n/g' $DEFCONFIG || true
          
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' $DEFCONFIG || true
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' $DEFCONFIG || true
          sed -i 's/CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO=y/# CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO is not set/g' $DEFCONFIG || true
          sed -i 's/CONFIG_INIT_STACK_ALL_ZERO=y/# CONFIG_INIT_STACK_ALL_ZERO is not set/g' $DEFCONFIG || true

          # Включение флагов KernelSU-Next и SUSFS в конфигурационный файл
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG

      - name: Compile Kernel Image
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:/usr/bin:/bin:$PATH"
          
          MAKE_ARGS="O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCC=gcc HOSTLD=/usr/bin/ld LD=ld.lld"
          
          make $MAKE_ARGS floral_defconfig
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS Image -j$(nproc)

      - name: Upload Finished Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-KSU-Next-SUSFS-Kernel
          path: kernel/out/arch/arm64/boot/Image
