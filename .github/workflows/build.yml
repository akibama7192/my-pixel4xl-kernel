name: Build Pixel 4 XL ReSukiSU Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: Xiaoxindada/android-kernel-build-action@main
        with:
          kernel-url: https://github.com
          kernel-branch: android-13
          config: floral_defconfig
          arch: arm64
          android-version: 13
          ksu: true
          ksu-other: true
          ksu-url: https://github.com
          ksu-version: main
