name: Build Pixel 4 XL KSU-Next Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space Manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Proton Clang Compiler
        run: |
          RAW_URL="https: / / github.com / kdrag0n / proton-clang.git"
          CLANG_REPO=$(echo "$RAW_URL" | tr -d ' ')
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          git clone --depth=1 "$CLANG_REPO" clang

      - name: Clone Kirisakura Kernel Source
        run: |
          RAW_URL="https: / / github.com / freak07 / FLORAL.git"
          KERNEL_REPO=$(echo "$RAW_URL" | tr -d ' ')
          git clone --depth=1 "$KERNEL_REPO" $GITHUB_WORKSPACE/kernel

      - name: Integrate KernelSU-Next Source Code
        run: |
          cd $GITHUB_WORKSPACE/kernel
          RAW_URL="https: / / github.com / rifsxd / KernelSU-Next.git"
          KSUNEXT_REPO=$(echo "$RAW_URL" | tr -d ' ')
          
          git submodule add "$KSUNEXT_REPO" KernelSU
          echo "obj-y += KernelSU/" >> Makefile
          
          # Отключаем проблемные проверки компилятора
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/floral_defconfig
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/floral_defconfig
          
          # Заменяем запрещенный режим инициализации переменных zero на разрешенный pattern
          sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' Makefile
          
          # Принудительно включаем KSU-Next и маскировку SUSFS для банков
          echo "CONFIG_KSU=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/floral_defconfig

      - name: Compile Kernel Image
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          cd $GITHUB_WORKSPACE/kernel
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/clang/bin
          
          # Изолируем системный PATH для сборки утилит хоста
          export PATH=/usr/bin:/bin:$PATH
          
          # Создаем базовую конфигурацию .config
          make O=out HOSTCC=gcc HOSTLD=/usr/bin/ld.bfd floral_defconfig
          
          # Добавляем в флаги компилятора то самое длинное подтверждение, которое просил Clang
          EXTRA_FLAGS="-mllvm -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang"
          
          # Запускаем финальную компиляцию ядра
          make O=out \
            CC="$CLANG_BIN/clang $EXTRA_FLAGS" \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            HOSTCC=gcc \
            HOSTLD=/usr/bin/ld.bfd \
            -j$(nproc)

      - name: Upload Finished Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-KSU-Next-Kernel
          path: kernel/out/arch/arm64/boot/Image.gz
