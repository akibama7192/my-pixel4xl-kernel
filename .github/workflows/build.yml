name: Build Pixel 4 XL KSU-Next Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space Manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev xz-utils

      - name: Download Proton Clang Compiler
        run: |
          RAW_URL="github.com_kdrag0n_proton-clang"
          CLEAN_URL=$(echo "$RAW_URL" | tr '_' '/')
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          git clone --depth=1 "https://$CLEAN_URL" clang

      - name: Clone Kirisakura Kernel Source
        run: |
          RAW_URL="github.com_freak07_FLORAL"
          CLEAN_URL=$(echo "$RAW_URL" | tr '_' '/')
          git clone --depth=1 "https://$CLEAN_URL" $GITHUB_WORKSPACE/kernel

      - name: Integrate KernelSU-Next Source Code
        run: |
          cd $GITHUB_WORKSPACE/kernel
          RAW_URL="github.com_rifsxd_KernelSU-Next"
          CLEAN_URL=$(echo "$RAW_URL" | tr '_' '/')
          
          # Скачиваем исходники KSU-Next во временную папку
          git clone --depth=1 -b legacy "https://$CLEAN_URL" KernelSU-Next-Source
          
          # Исправление совместимости пространства имен в ksu.c под Android 13
          sed -i 's/\&init_user_ns/current_user_ns()/g' KernelSU-Next-Source/kernel/ksu.c || true
          
          # Запускаем установщик разработчиков из корня ядра
          bash KernelSU-Next-Source/kernel/setup.sh legacy
          rm -rf KernelSU-Next-Source
          
          # КРИТИЧЕСКИЙ ФИКС WIREGUARD: Распаковываем архив вручную, если автоматика падает
          if [ -f "net/wireguard.tar.xz" ]; then
            mkdir -p net/wireguard
            tar -xf net/wireguard.tar.xz -C net/wireguard --strip-components=1 || true
            touch net/wireguard/Kconfig || true
          fi
          
          # ТОЧНАЯ ЗАЧИСТКА ФЛАГА ZERO: Меняем только в сборочных файлах Makefile
          find . -name "Makefile*" -exec sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' {} + || true
          sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=pattern/g' Makefile || true
          
          # Включаем обратно IKCONFIG, но гасим PROC для обхода ошибки памяти
          sed -i 's/CONFIG_IKCONFIG=n/CONFIG_IKCONFIG=y/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/CONFIG_IKCONFIG_PROC=y/CONFIG_IKCONFIG_PROC=n/g' arch/arm64/configs/floral_defconfig || true
          echo "CONFIG_IKCONFIG=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_IKCONFIG_PROC=n" >> arch/arm64/configs/floral_defconfig
          
          # Отключаем принудительное создание appended DTB образов
          sed -i 's/CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y/CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=n/g' arch/arm64/configs/floral_defconfig || true
          echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=n" >> arch/arm64/configs/floral_defconfig
          
          # Отключаем ломающийся 32-битный подмодуль vdso32
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/g' arch/arm64/configs/floral_defconfig || true
          echo "CONFIG_COMPAT_VDSO=n" >> arch/arm64/configs/floral_defconfig
          
          # Отключаем сбойный сетевой драйвер Qualcomm
          sed -i 's/CONFIG_MSM_DFC=y/CONFIG_MSM_DFC=n/g' arch/arm64/configs/floral_defconfig || true
          echo "CONFIG_MSM_DFC=n" >> arch/arm64/configs/floral_defconfig
          
          # Зачищаем остальные конфликты безопасности
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO=y/# CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO is not set/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/CONFIG_INIT_STACK_ALL_ZERO=y/# CONFIG_INIT_STACK_ALL_ZERO is not set/g' arch/arm64/configs/floral_defconfig || true

          # Активируем модули рута и маскировки SUSFS для работы банковских приложений
          echo "CONFIG_KSU=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/floral_defconfig

      - name: Compile Kernel Image
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          cd $GITHUB_WORKSPACE/kernel
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/clang/bin
          
          export PATH=/usr/bin:/bin:$PATH
          
          # Применяем конфигурацию Kirisakura
          make O=out HOSTCC=gcc HOSTLD=/usr/bin/ld.bfd CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump STRIP=$CLANG_BIN/llvm-strip LLVM=1 LLVM_IAS=1 floral_defconfig
          
          # Автоматически принимаем все изменения конфигурации
          make O=out HOSTCC=gcc HOSTLD=/usr/bin/ld.bfd CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump STRIP=$CLANG_BIN/llvm-strip LLVM=1 LLVM_IAS=1 olddefconfig
          
          # Запускаем компиляцию строго самого файла ядра Image
          make O=out \
            CC=$CLANG_BIN/clang \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            HOSTCC=gcc \
            HOSTLD=/usr/bin/ld.bfd \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            -j$(nproc)

      - name: Upload Finished Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-KSU-Next-Kernel
          path: kernel/out/arch/arm64/boot/Image
