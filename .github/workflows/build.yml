name: Build Pixel 4 XL KSU-Next Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space Manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Proton Clang Compiler
        run: |
          # В строке нет знаков слэша, браузер её не испортит
          RAW_URL="github.com  kdrag0n  proton-clang"
          # Робот убирает лишние пробелы и заменяет оставшийся двойной пробел на слэш
          CLEAN_URL=$(echo "$RAW_URL" | sed 's/  /\//g')
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          git clone --depth=1 "https://$CLEAN_URL" clang

      - name: Clone Google AOSP Pixel 4 XL Kernel Source
        run: |
          # В строке нет знаков слэша, браузер её не испортит
          RAW_URL="android.googlesource.com  kernel  msm"
          CLEAN_URL=$(echo "$RAW_URL" | sed 's/  /\//g')
          git clone --depth=1 -b android-msm-coral-4.14-android13 "https://$CLEAN_URL" $GITHUB_WORKSPACE/kernel

      - name: Integrate KernelSU-Next Source Code
        run: |
          cd $GITHUB_WORKSPACE/kernel
          # В строке нет знаков слэша, браузер её не испортит
          RAW_URL="github.com  rifsxd  KernelSU-Next"
          CLEAN_URL=$(echo "$RAW_URL" | sed 's/  /\//g')
          
          # Чистая интеграция подмодуля root-доступа
          git submodule add "https://$CLEAN_URL" KernelSU
          echo "obj-y += KernelSU/" >> Makefile
          
          # Отключаем проблемные проверки компилятора в конфигурациях
          for config in arch/arm64/configs/coral_defconfig arch/arm64/configs/bms_defconfig; do
            if [ -f "$config" ]; then
              sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' "$config" || true
              sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' "$config" || true
              sed -i 's/CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO=y/# CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO is not set/g' "$config" || true
              sed -i 's/CONFIG_INIT_STACK_ALL_ZERO=y/# CONFIG_INIT_STACK_ALL_ZERO is not set/g' "$config" || true
              
              # Принудительно включаем модули рута и маскировки SUSFS для банков
              echo "CONFIG_KSU=y" >> "$config"
              echo "CONFIG_KSU_NEXT=y" >> "$config"
              echo "CONFIG_KSU_SUSFS=y" >> "$config"
            fi
          done
          
          # Зачищаем флаги автоматической инициализации из главного Makefile ядра
          sed -i 's/-ftrivial-auto-var-init=zero//g' Makefile || true

      - name: Compile Kernel Image
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          cd $GITHUB_WORKSPACE/kernel
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/clang/bin
          
          # Полная изоляция PATH для безопасной сборки утилит хоста
          export PATH=/usr/bin:/bin:$PATH
          
          # Применяем релизный bms_defconfig от Google без ошибок планировщика в fork.c
          make O=out HOSTCC=gcc HOSTLD=/usr/bin/ld.bfd bms_defconfig
          
          # Запускаем финальную компиляцию ядра
          make O=out \
            CC=$CLANG_BIN/clang \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            HOSTCC=gcc \
            HOSTLD=/usr/bin/ld.bfd \
            -j$(nproc)

      - name: Upload Finished Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Pixel4XL-Google-KSU-Next-Kernel
          path: kernel/out/arch/arm64/boot/Image.gz
