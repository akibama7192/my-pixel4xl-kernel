name: Build Pixel 4 XL KSU-Next Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space Manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Proton Clang Compiler
        run: |
          RAW_URL="github.com_kdrag0n_proton-clang"
          CLEAN_URL=$(echo "$RAW_URL" | tr '_' '/')
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          git clone --depth=1 "https://$CLEAN_URL" clang

      - name: Clone Kirisakura Kernel Source
        run: |
          RAW_URL="github.com_freak07_FLORAL"
          CLEAN_URL=$(echo "$RAW_URL" | tr '_' '/')
          git clone --depth=1 "https://$CLEAN_URL" $GITHUB_WORKSPACE/kernel

      - name: Integrate KernelSU-Next Source Code
        run: |
          cd $GITHUB_WORKSPACE/kernel
          RAW_URL="github.com_rifsxd_KernelSU-Next"
          CLEAN_URL=$(echo "$RAW_URL" | tr '_' '/')
          
          # Скачиваем стабильную legacy ветку с маскировкой SUSFS
          git clone --depth=1 -b legacy "https://$CLEAN_URL" KernelSU
          echo "obj-y += KernelSU/" >> Makefile
          
          # Отключаем только ломающийся 32-битный подмодуль vdso32
          sed -i 's/CONFIG_COMPAT_VDSO=y/CONFIG_COMPAT_VDSO=n/g' arch/arm64/configs/floral_defconfig || true
          echo "CONFIG_COMPAT_VDSO=n" >> arch/arm64/configs/floral_defconfig
          
          # КРИТИЧЕСКИЙ ШАГ: Возвращаем Stack Protector на место для исправления ошибки dfc_qmi.c
          sed -i 's/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/CONFIG_CC_STACKPROTECTOR_STRONG=y/g' arch/arm64/configs/floral_defconfig || true
          echo "CONFIG_CC_STACKPROTECTOR_STRONG=y" >> arch/arm64/configs/floral_defconfig
          
          # Зачищаем остальные конфликты
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO=y/# CONFIG_CC_HAS_AUTO_VAR_INIT_ZERO is not set/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/CONFIG_INIT_STACK_ALL_ZERO=y/# CONFIG_INIT_STACK_ALL_ZERO is not set/g' arch/arm64/configs/floral_defconfig || true
          sed -i 's/-ftrivial-auto-var-init=zero//g' Makefile || true
          
          # Активируем модули рута и маскировки SUSFS для работы банковских приложений
          echo "CONFIG_KSU=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/floral_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/floral_defconfig

      - name: Compile Kernel Image
        env:
          ARCH: arm64
          SUBARCH: arm64
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          cd $GITHUB_WORKSPACE/kernel
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/clang/bin
          
          export PATH=/usr/bin:/bin:$PATH
          
          # Применяем конфигурацию Kirisakura (floral_defconfig)
          make O=out HOSTCC=gcc HOSTLD=/usr/bin/ld.bfd floral_defconfig
          
          # Запускаем компиляцию ядра с жестким указанием целевой архитектуры компилятора --target
          make O=out \
            CC="$CLANG_BIN/clang --target=aarch64-linux-gnu" \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            HOSTCC=gcc \
            HOSTLD=/usr/bin/ld.bfd \
            Image \
            -j$(nproc)

      - name: Upload Finished Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-KSU-Next-Kernel
          path: kernel/out/arch/arm64/boot/Image
