name: Build Pixel 4 XL ReSukiSU Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space Manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Google Clang Compiler
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          # Качаем официальный проверенный компилятор Clang r416183b от Google для Android 13
          git clone --depth=1 -b ndk-r23-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          # Качаем необходимые бинарные утилиты (GCC/Linker) для сборки ядра 4.14
          git clone --depth=1 -b master https://googlesource.com gcc

      - name: Clone Kirisakura Kernel Source
        run: |
          git clone --depth=1 -b android-13 https://github.com $GITHUB_WORKSPACE/kernel

      - name: Integrate ReSukiSU Source Code
        run: |
          cd $GITHUB_WORKSPACE/kernel
          curl -LSs https://githubusercontent.com | bash -s main

      - name: Compile Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out floral_defconfig
          make O=out CC=clang -j$(nproc)

      - name: Upload Finished Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kirisakura-ReSukiSU-Kernel
          path: kernel/out/arch/arm64/boot/Image.gz
